apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ecom/order-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: ecom-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://ecom_user:$(POSTGRES_PASSWORD)@postgres:5432/ecom_db"
            - name: CELERY_BROKER_URL
              value: "amqp://ecom_user:ecom_password@rabbitmq:5672//"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
