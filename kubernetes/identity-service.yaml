apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: ecom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: ecom/identity-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: ecom-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://ecom_user:$(POSTGRES_PASSWORD)@postgres:5432/ecom_db"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: ecom
spec:
  selector:
    app: identity-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
