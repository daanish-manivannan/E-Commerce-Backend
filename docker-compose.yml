services:
  # --- SHARED INFRASTRUCTURE ---
  db:
    image: postgres:15
    container_name: ecom_postgres
    environment:
      POSTGRES_DB: ecom_db
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    ports:
      - "6379:6379"
    restart: always
    
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ORDER & CATALOG SERVICE (Django) ---
  order-service:
    build: 
      context: "./Order & Catalog Service"
      dockerfile: Dockerfile
    container_name: ecom_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - "./Order & Catalog Service:/app"
      - django_static:/app/static/
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SHARED_JWT_SECRET} # Injected from .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  order_worker:
    build: "./Order & Catalog Service"
    container_name: ecom_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - "./Order & Catalog Service:/app"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SHARED_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  order_beat:
    build: "./Order & Catalog Service"
    container_name: ecom_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - "./Order & Catalog Service:/app"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SHARED_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # --- IDENTITY SERVICE (FastAPI) ---
  identity_service:
    build:
      context: "./Identity Service"
      dockerfile: Dockerfile
    container_name: ecom_identity
    ports:
      - "8001:8001"
    volumes:
      - "./Identity Service:/app"
    environment:
      - DATABASE_URL=postgresql://ecom_user:ecom_password@db:5432/ecom_db
      - JWT_SECRET=${SHARED_JWT_SECRET} # Injected from .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
  gateway:
    image: nginx:latest
    container_name: ecom_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/app/static/:ro
    depends_on:
      - identity_service
      - order-service
    restart: always
volumes:
  postgres_data:
  django_static: